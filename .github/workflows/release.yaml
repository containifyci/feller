name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: write # for checkout
  id-token: write # for authenticating to Google Cloud Platform
  pull-requests: write # for updating pr

jobs:
  build-and-release:
    uses: containifyci/.github/.github/workflows/release.yml@v1
    secrets: inherit
  test-release:
    name: Test GitHub Action After Release
    runs-on: ubuntu-latest
    needs: [build-and-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test action installation
        uses: ./.github/actions/setup-feller
        with:
          version: 'latest'

      - name: Create test config
        run: |
          cat > .teller.yml << 'EOF'
          providers:
            test_env:
              kind: dotenv
              maps:
                - id: test_vars
                  path: .env.test
                  keys:
                    TEST_VAR: TEST_OUTPUT
          EOF
          echo "TEST_VAR=release_test" > .env.test

      - name: Test action with command
        uses: ./.github/actions/setup-feller
        with:
          command: 'env'
