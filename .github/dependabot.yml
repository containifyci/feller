version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: "scope"
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "go"
      include: "scope"
  - package-ecosystem: "gomod"
    directory: ".containifyci"
    schedule:
      interval: "daily"
    groups:
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"